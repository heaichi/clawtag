# JVM 参数：本机物理内存 8 GB，原先的 -Xmx8G/-XX:MaxMetaspaceSize=4G 会逼着 JVM 换页，
# 是构建十几分钟的主因之一。降到 3g/1g（若出现 OOM 可再调低到 2g）。
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.overridePathCheck=true

# 构建提速：并行执行 + 构建缓存（配合 Gradle daemon 常驻，增量构建明显更快）
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Kotlin 增量编译已恢复开启。
# 原先因“C: 与 D: 跨盘路径问题”被关掉，但现在项目、Gradle 家目录、pub 缓存全在 C 盘，
# 该 workaround 已无必要；如再遇到跨盘 Kotlin 报错，把这里改回 false。
kotlin.incremental=true

# This builtInKotlin flag was added automatically by Flutter migrator
# 关闭资源优化：它会重命名/裁剪资源，而本应用要在运行期用名字查找（通知图标）。
# 关掉后 APK 略大，但通知图标一定在（否则 release 包所有提醒都排不上）。
android.enableResourceOptimizations=false

android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
